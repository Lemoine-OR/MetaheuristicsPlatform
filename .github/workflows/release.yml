name: Create Release

run-name: Release MetaheuristicsPlatform from ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Documentation
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: metaheuristicsplatform-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify exact-SHA release prerequisites
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      target_sha: ${{ steps.gate.outputs.target_sha }}
      build_run_id: ${{ steps.gate.outputs.build_run_id }}
      docs_run_id: ${{ steps.gate.outputs.docs_run_id }}

    steps:
      - id: gate
        name: Require main HEAD and both prerequisite workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            target_sha="$WORKFLOW_SHA"

            if [[ "$WORKFLOW_BRANCH" != "main" ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$WORKFLOW_CONCLUSION" != "success" ]]; then
              echo "Release trigger workflow did not succeed; release skipped."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            target_sha="$DISPATCH_SHA"
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"

          if [[ "$target_sha" != "$main_sha" ]]; then
            echo "Target SHA is not current main HEAD; release skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$target_sha&branch=main&per_page=100")"

          build_run_id="$(
            jq -r '
              [.workflow_runs[]
               | select(.path==".github/workflows/build.yml")]
              | sort_by(.run_number)
              | last
              | .id // ""
            ' <<<"$runs_json"
          )"

          build_conclusion="$(
            jq -r '
              [.workflow_runs[]
               | select(.path==".github/workflows/build.yml")]
              | sort_by(.run_number)
              | last
              | .conclusion // ""
            ' <<<"$runs_json"
          )"

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            docs_run_id="$WORKFLOW_RUN_ID"
            docs_conclusion="$WORKFLOW_CONCLUSION"
          else
            docs_run_id="$(
              jq -r '
                [.workflow_runs[]
                 | select(.path==".github/workflows/documentation.yml")]
                | sort_by(.run_number)
                | last
                | .id // ""
              ' <<<"$runs_json"
            )"

            docs_conclusion="$(
              jq -r '
                [.workflow_runs[]
                 | select(.path==".github/workflows/documentation.yml")]
                | sort_by(.run_number)
                | last
                | .conclusion // ""
              ' <<<"$runs_json"
            )"
          fi

          echo "Build and Test: $build_conclusion | run=$build_run_id"
          echo "Build Documentation: $docs_conclusion | run=$docs_run_id"

          if [[ "$build_conclusion" != "success" ||
                "$docs_conclusion" != "success" ||
                -z "$build_run_id" ||
                -z "$docs_run_id" ]]; then
            echo "Both exact-SHA prerequisite workflows and run ids are required."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build_run_id=$build_run_id" >> "$GITHUB_OUTPUT"
          echo "docs_run_id=$docs_run_id" >> "$GITHUB_OUTPUT"

          version="$(
            gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=$target_sha" \
              --jq '.content' |
            tr -d '\n' |
            base64 --decode |
            jq -r '.version'
          )"

          tag="v$version"

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; duplicate publication skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists without a release; refusing ambiguous publication."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

  release:
    name: Assemble validated artifacts and publish release
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PublicRelease: 'true'
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
      BUILD_RUN_ID: ${{ needs.gate.outputs.build_run_id }}
      DOCS_RUN_ID: ${{ needs.gate.outputs.docs_run_id }}

    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        shell: pwsh
        run: |
          $head = (& git rev-parse HEAD).Trim()

          if ($head -ne $env:TARGET_SHA) {
              throw "Release checkout SHA mismatch."
          }

      - name: Download exact-SHA validated binaries
        shell: pwsh
        run: |
          $binaryRoot =
              Join-Path `
                  (Get-Location).Path `
                  "src\MetaheuristicsPlatform\bin\Release\net10.0"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $binaryRoot |
              Out-Null

          & gh run download `
              $env:BUILD_RUN_ID `
              --repo $env:GITHUB_REPOSITORY `
              --name "MetaheuristicsPlatform-Binaries" `
              --dir $binaryRoot

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to download exact-SHA validated binaries."
          }

          $dll =
              Join-Path `
                  $binaryRoot `
                  "MetaheuristicsPlatform.dll"

          if (-not (Test-Path -LiteralPath $dll -PathType Leaf)) {
              throw "Validated binary artifact is incomplete."
          }

      - name: Download exact-SHA validated documentation
        shell: pwsh
        run: |
          $siteRoot =
              Join-Path `
                  (Get-Location).Path `
                  "Documentation\site"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $siteRoot |
              Out-Null

          & gh run download `
              $env:DOCS_RUN_ID `
              --repo $env:GITHUB_REPOSITORY `
              --name "MetaheuristicsPlatform-Documentation" `
              --dir $siteRoot

          if ($LASTEXITCODE -ne 0) {
              throw "Unable to download exact-SHA validated documentation."
          }

          $index =
              Join-Path `
                  $siteRoot `
                  "index.html"

          if (-not (Test-Path -LiteralPath $index -PathType Leaf)) {
              throw "Validated documentation artifact is incomplete."
          }

      - name: Prepare and validate release assets
        id: release_info
        shell: pwsh
        run: |
          $release = ./build/Prepare-ReleaseAssets.ps1 -CommitId $env:TARGET_SHA

          "version=$($release.ReleaseVersion)" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "tag=$($release.Tag)" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload release bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MetaheuristicsPlatform-${{ steps.release_info.outputs.version }}-release-bundle
          path: Documentation/release
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.release_info.outputs.prerelease }}
        run: |
          $assets =
              @(
                  Get-ChildItem -LiteralPath "Documentation\release" -File |
                  Sort-Object Name |
                  ForEach-Object { $_.FullName }
              )

          if ($assets.Count -eq 0) {
              throw "No release assets were prepared."
          }

          $notesPath =
              Join-Path $env:RUNNER_TEMP "MetaheuristicsPlatform-release-notes.md"

          ./build/Get-ReleaseNotes.ps1 `
              -Root (Get-Location).Path `
              -Version $env:RELEASE_VERSION `
              -OutputPath $notesPath

          $arguments =
              @(
                  "release",
                  "create",
                  $env:RELEASE_TAG
              )

          $arguments += $assets

          $arguments +=
              @(
                  "--repo",
                  $env:GITHUB_REPOSITORY,
                  "--target",
                  $env:TARGET_SHA,
                  "--title",
                  "MetaheuristicsPlatform $env:RELEASE_VERSION",
                  "--notes-file",
                  $notesPath
              )

          if ($env:RELEASE_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
              $arguments += "--latest=false"
          }

          & gh @arguments

          if ($LASTEXITCODE -ne 0) {
              throw "GitHub Release publication failed."
          }

name: Create Release

run-name: Release MetaheuristicsPlatform from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metaheuristicsplatform-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, validate and publish release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PublicRelease: 'true'

    steps:
      - name: Require main branch
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Releases must be started from the main branch."
          }

      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Graphviz
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "15.1.1"
          $packageBase = "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/$version"
          $archiveName = "windows_10_cmake_Release_Graphviz-$version-win64.zip"

          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $checksumFile = "$archive.sha256"
          $destination = Join-Path $env:RUNNER_TEMP "graphviz"

          Invoke-WebRequest `
            -Uri "$packageBase/$archiveName" `
            -OutFile $archive

          Invoke-WebRequest `
            -Uri "$packageBase/$archiveName.sha256" `
            -OutFile $checksumFile

          $checksumText = [System.IO.File]::ReadAllText($checksumFile)
          $match = [regex]::Match(
            $checksumText,
            '(?i)\b[0-9a-f]{64}\b'
          )

          if (-not $match.Success) {
            throw "Unable to read the official Graphviz SHA-256 checksum."
          }

          $expectedHash = $match.Value.ToUpperInvariant()
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToUpperInvariant()

          if ($actualHash -ne $expectedHash) {
            throw "Graphviz SHA-256 verification failed."
          }

          Write-Host "Graphviz archive SHA-256 verified."

          Remove-Item $destination -Recurse -Force -ErrorAction SilentlyContinue

          Expand-Archive `
            -Path $archive `
            -DestinationPath $destination `
            -Force

          $dot = Get-ChildItem `
            -Path $destination `
            -Recurse `
            -File `
            -Filter "dot.exe" |
            Select-Object -First 1

          if ($null -eq $dot) {
            throw "Graphviz archive was extracted but dot.exe was not found."
          }

          $graphvizBin = $dot.Directory.FullName

          $graphvizBin |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          $env:PATH = "$graphvizBin;$env:PATH"

          & $dot.FullName -V

          if ($LASTEXITCODE -ne 0) {
            throw "Graphviz dot validation failed."
          }

      - name: Install Doxygen
        shell: pwsh
        run: |
          ./tools/Install-Doxygen.ps1

      - name: Automation preflight
        shell: pwsh
        run: |
          ./tools/Test-Automation.ps1

      - name: Full public-release build
        shell: pwsh
        run: |
          ./build/Build-All.ps1

      - name: Prepare and validate release assets
        id: release_info
        shell: pwsh
        run: |
          $release = ./build/Prepare-ReleaseAssets.ps1
          "version=$($release.ReleaseVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "build_version=$($release.BuildVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($release.Tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "commit=$($release.CommitId)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Guard against duplicate tag or release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          $remoteTag = & git ls-remote --tags --refs origin "refs/tags/$env:RELEASE_TAG"
          $gitExitCode = $LASTEXITCODE

          if ($gitExitCode -ne 0) {
            throw "Unable to query remote Git tags."
          }

          if (-not [string]::IsNullOrWhiteSpace(($remoteTag | Out-String).Trim())) {
            throw "Git tag '$env:RELEASE_TAG' already exists."
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $releaseUrl =
            "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"

          $response = Invoke-WebRequest `
            -Uri $releaseUrl `
            -Headers $headers `
            -SkipHttpErrorCheck

          if ($response.StatusCode -eq 200) {
            throw "GitHub Release '$env:RELEASE_TAG' already exists."
          }

          if ($response.StatusCode -ne 404) {
            throw "Unable to query GitHub Release '$env:RELEASE_TAG' (HTTP $($response.StatusCode))."
          }

          Write-Host "No existing Git tag or GitHub Release found for '$env:RELEASE_TAG'."

      - name: Upload release bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MetaheuristicsPlatform-${{ steps.release_info.outputs.version }}-release-bundle
          path: Documentation/release
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.release_info.outputs.prerelease }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath "Documentation\release" -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }
          )
          if ($assets.Count -eq 0) { throw "No release assets were prepared." }

          $notesPath = Join-Path $env:RUNNER_TEMP "MetaheuristicsPlatform-release-notes.md"
          ./build/Get-ReleaseNotes.ps1 -Root (Get-Location).Path -Version $env:RELEASE_VERSION -OutputPath $notesPath

          $arguments = @("release","create",$env:RELEASE_TAG)
          $arguments += $assets
          $arguments += @(
            "--repo",$env:GITHUB_REPOSITORY,
            "--target",$env:GITHUB_SHA,
            "--title","MetaheuristicsPlatform $env:RELEASE_VERSION",
            "--notes-file",$notesPath
          )

          if ($env:RELEASE_PRERELEASE -eq "true") {
            $arguments += "--prerelease"
            $arguments += "--latest=false"
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }

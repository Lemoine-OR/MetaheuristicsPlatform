name: Create Release

run-name: Release MetaheuristicsPlatform from ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build and Test
      - Build Documentation
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: metaheuristicsplatform-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Verify exact-SHA release prerequisites
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      target_sha: ${{ steps.gate.outputs.target_sha }}
    steps:
      - id: gate
        name: Require main HEAD and both prerequisite workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            target_sha="$WORKFLOW_SHA"
            if [[ "$WORKFLOW_BRANCH" != "main" ]]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            target_sha="$DISPATCH_SHA"
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$target_sha" != "$main_sha" ]]; then
            echo "Target SHA is not current main HEAD; release skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$target_sha&branch=main&per_page=100")"

          build_conclusion="$(
            jq -r '
              [.workflow_runs[]
               | select(.name=="Build and Test")]
              | sort_by(.run_number)
              | last
              | .conclusion // ""
            ' <<<"$runs_json"
          )"

          docs_conclusion="$(
            jq -r '
              [.workflow_runs[]
               | select(.name=="Build Documentation")]
              | sort_by(.run_number)
              | last
              | .conclusion // ""
            ' <<<"$runs_json"
          )"

          echo "Build and Test: $build_conclusion"
          echo "Build Documentation: $docs_conclusion"

          if [[ "$build_conclusion" != "success" ||
                "$docs_conclusion" != "success" ]]; then
            echo "Both prerequisite workflows are not green yet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(
            gh api "repos/$GITHUB_REPOSITORY/contents/version.json?ref=$target_sha" \
              --jq '.content' |
            tr -d '\n' |
            base64 --decode |
            jq -r '.version'
          )"

          tag="v$version"

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; duplicate publication skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists without a release; refusing ambiguous publication."
            exit 1
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build, validate and publish release
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PublicRelease: 'true'
      TARGET_SHA: ${{ needs.gate.outputs.target_sha }}

    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        shell: pwsh
        run: |
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne $env:TARGET_SHA) {
              throw "Release checkout SHA mismatch."
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Graphviz
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "15.1.1"
          $packageBase = "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/$version"
          $archiveName = "windows_10_cmake_Release_Graphviz-$version-win64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $checksumFile = "$archive.sha256"
          $destination = Join-Path $env:RUNNER_TEMP "graphviz"

          Invoke-WebRequest -Uri "$packageBase/$archiveName" -OutFile $archive
          Invoke-WebRequest -Uri "$packageBase/$archiveName.sha256" -OutFile $checksumFile

          $checksumText = [System.IO.File]::ReadAllText($checksumFile)
          $match = [regex]::Match($checksumText, '(?i)\b[0-9a-f]{64}\b')
          if (-not $match.Success) { throw "Unable to read Graphviz SHA-256 checksum." }

          $expectedHash = $match.Value.ToUpperInvariant()
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -ne $expectedHash) { throw "Graphviz SHA-256 verification failed." }

          Remove-Item $destination -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $archive -DestinationPath $destination -Force
          $dot = Get-ChildItem -Path $destination -Recurse -File -Filter "dot.exe" | Select-Object -First 1
          if ($null -eq $dot) { throw "dot.exe not found." }
          $dot.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Doxygen
        shell: pwsh
        run: ./tools/Install-Doxygen.ps1

      - name: Automation preflight
        shell: pwsh
        run: ./tools/Test-Automation.ps1

      - name: Full public-release build
        shell: pwsh
        run: ./build/Build-All.ps1

      - name: Prepare and validate release assets
        id: release_info
        shell: pwsh
        run: |
          $release = ./build/Prepare-ReleaseAssets.ps1
          "version=$($release.ReleaseVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$($release.Tag)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload release bundle as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: MetaheuristicsPlatform-${{ steps.release_info.outputs.version }}-release-bundle
          path: Documentation/release
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_info.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.release_info.outputs.prerelease }}
        run: |
          $assets = @(
              Get-ChildItem -LiteralPath "Documentation\release" -File |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )

          if ($assets.Count -eq 0) { throw "No release assets were prepared." }

          $notesPath = Join-Path $env:RUNNER_TEMP "MetaheuristicsPlatform-release-notes.md"
          ./build/Get-ReleaseNotes.ps1 -Root (Get-Location).Path -Version $env:RELEASE_VERSION -OutputPath $notesPath

          $arguments = @("release","create",$env:RELEASE_TAG)
          $arguments += $assets
          $arguments += @(
              "--repo",$env:GITHUB_REPOSITORY,
              "--target",$env:TARGET_SHA,
              "--title","MetaheuristicsPlatform $env:RELEASE_VERSION",
              "--notes-file",$notesPath
          )

          if ($env:RELEASE_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
              $arguments += "--latest=false"
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed." }

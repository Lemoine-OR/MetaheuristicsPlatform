name: Build Documentation

run-name: Documentation for ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build and Test
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  documentation:
    name: Build versioned and validated Doxygen documentation
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout exact documentation commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        shell: pwsh
        run: |
          $head = (& git rev-parse HEAD).Trim()
          if ($head -ne $env:TARGET_SHA) {
              throw "Documentation checkout SHA mismatch."
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Validate PowerShell automation syntax
        shell: pwsh
        run: |
          ./tools/Test-PowerShellSyntax.ps1

      - name: Install Graphviz
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "15.1.1"
          $packageBase = "https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/$version"
          $archiveName = "windows_10_cmake_Release_Graphviz-$version-win64.zip"

          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $checksumFile = "$archive.sha256"
          $destination = Join-Path $env:RUNNER_TEMP "graphviz"

          Invoke-WebRequest `
            -Uri "$packageBase/$archiveName" `
            -OutFile $archive

          Invoke-WebRequest `
            -Uri "$packageBase/$archiveName.sha256" `
            -OutFile $checksumFile

          $checksumText = [System.IO.File]::ReadAllText($checksumFile)
          $match = [regex]::Match(
            $checksumText,
            '(?i)\b[0-9a-f]{64}\b'
          )

          if (-not $match.Success) {
            throw "Unable to read the official Graphviz SHA-256 checksum."
          }

          $expectedHash = $match.Value.ToUpperInvariant()
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToUpperInvariant()

          if ($actualHash -ne $expectedHash) {
            throw "Graphviz SHA-256 verification failed."
          }

          Write-Host "Graphviz archive SHA-256 verified."

          Remove-Item $destination -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive `
            -Path $archive `
            -DestinationPath $destination `
            -Force

          $dot = Get-ChildItem `
            -Path $destination `
            -Recurse `
            -File `
            -Filter "dot.exe" |
            Select-Object -First 1

          if ($null -eq $dot) {
            throw "Graphviz archive was extracted but dot.exe was not found."
          }

          $graphvizBin = $dot.Directory.FullName

          $graphvizBin |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          $env:PATH = "$graphvizBin;$env:PATH"

          & $dot.FullName -V

          if ($LASTEXITCODE -ne 0) {
            throw "Graphviz dot validation failed."
          }

      - name: Install Doxygen
        shell: pwsh
        run: |
          ./tools/Install-Doxygen.ps1

      - name: Build and validate documentation
        shell: pwsh
        run: |
          ./docs/build-documentation.ps1

      - name: Upload complete documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: MetaheuristicsPlatform-Documentation
          path: Documentation/site
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: Documentation/site

  deploy:
    name: Deploy documentation to GitHub Pages
    if: needs.documentation.result == 'success' && github.event_name != 'pull_request'
    needs:
      - documentation
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
